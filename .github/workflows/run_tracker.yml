name: Google Maps Screenshot Tracker

on:
  schedule:
    # Draait elke 30 minuten (Cron-schema)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Hiermee kun je de knop handmatig indrukken om te testen

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen
      uses: actions/checkout@v3

    - name: Python instellen
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Playwright installeren
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install firefox

    - name: Draai het Python screenshot script
      run: python tracker.py

    - name: Sla screenshots op in de repository
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add screenshots/
        git commit -m "Nieuwe verkeersscreenshots toegevoegd" || exit 0
        git push
